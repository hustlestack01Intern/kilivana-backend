services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kilivana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/kilivana
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEDIA_ROOT: /data/uploads
      # No secret ships in this file. Both of the values that used to be here were on the
      # deployment preflight's placeholder deny-list, and this service runs with
      # SPRING_PROFILES_ACTIVE=prod, so `docker compose up` exited 1 at startup. A file that
      # ships a secret the application is then forbidden to accept is not a working local
      # setup. Requiring the developer to generate one is both honest and better hygiene than
      # publishing a known signing key and a known admin-bootstrap key:
      #   export JWT_SECRET=$(openssl rand -base64 32)
      #   export ADMIN_BOOTSTRAP_KEY=$(openssl rand -hex 24)
      # Compose fails with the same message if either is unset, so the requirement is loud.
      # Single-quoted, and the quoting is load-bearing twice over. Unquoted, a YAML scalar
      # containing ": " is a parse error, not a string — `docker compose config` failed with
      # "mapping values are not allowed in this context" and no service started at all.
      # Double-quoted instead fails differently: `\$` is not a valid YAML escape ("found
      # unknown escape character"). Single quotes make the backslash literal and need no
      # escaping.
      JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET - run: export JWT_SECRET=$(openssl rand -base64 32)}'
      ADMIN_BOOTSTRAP_KEY: '${ADMIN_BOOTSTRAP_KEY:?set ADMIN_BOOTSTRAP_KEY - run: export ADMIN_BOOTSTRAP_KEY=$(openssl rand -hex 24)}'
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      OPENAPI_ENABLED: "true"
      SWAGGER_ENABLED: "true"
      OPENAPI_PUBLIC: "false"
      # Compose publishes 8080 straight onto the host, so the socket peer Docker hands the
      # container is the bridge gateway, not the caller. Nothing appends to X-Forwarded-For
      # in this topology — a developer's curl passes its own header through untouched. So
      # there is no forwarded chain to verify here, and pretending otherwise would let any
      # local client name its own rate-limit bucket. Forwarded headers stay off and the
      # resolver keys on the peer; that is the honest reading of this network.
      #
      # A PaaS deployment is the opposite case: Render and Railway terminate TLS at an edge
      # that appends, and there the defaults in application-prod.yml apply. Set
      # TRUST_FORWARDED_HEADERS=true plus a TRUSTED_PROXIES list naming only that edge when
      # you put something that genuinely proxies in front of this service.
      TRUST_FORWARDED_HEADERS: "false"
    volumes:
      # Uploaded inspection photos and site-visit evidence must survive a rebuild.
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Liveness only, deliberately: readiness also covers Postgres and Redis, so using it
    # here would mark the app unhealthy whenever a dependency blips and make compose tear
    # down a process that is otherwise fine.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
